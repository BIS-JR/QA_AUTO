<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC;font-family:Inter,system-ui,sans-serif;color:#0F172A;font-size:14px}
*{box-sizing:border-box}
a{color:#2563EB}a:hover{color:#1D4ED8}
button,input{font:inherit}
:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
.inp{height:40px;width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:0 12px;background:#fff;color:#0F172A}
.inp:focus{outline:0;box-shadow:0 0 0 2px #C7D2FE;border-color:#818CF8}
.lab{font-size:13px;font-weight:500;color:#334155;display:flex;flex-direction:column;gap:6px}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;text-decoration:none;width:100%}
.btn.p{background:#4F46E5;color:#fff}.btn.p:hover{background:#4338CA;color:#fff}
.btn.o{background:#fff;border-color:#CBD5E1;color:#0F172A}.btn.o:hover{background:#F8FAFC;color:#0F172A}
</style>
</helmet>
<div style="height: 128px; background: #0F172A; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 20px"><img src="assets/fastinnovation.png" alt="Fast Innovation AI" style="height: 112px; width: auto; max-width: 100%; justify-self: start"><img src="assets/outtech.png" alt="OUTTECH Services IT" style="height: 88px; width: auto; max-width: 100%; justify-self: center"><img src="assets/qa-autonomous.png" alt="QA Autonomous" style="height: 96px; width: auto; max-width: 100%; justify-self: end"></div>
<div style="min-height: calc(100vh - 128px); display: flex; align-items: center; justify-content: center; padding: 32px 16px">
<div style="width: 100%; max-width: 400px; background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.05); padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<span style="width: 44px; height: 44px; border-radius: 12px; background: #4F46E5; color: #fff; display: grid; place-items: center; font-weight: 700">QA</span>
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Entrar no QA Autônomo</h1>
<p style="margin: 0; color: #475569">Automação de testes guiada por IA para o seu time.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<label class="lab">E-mail<input class="inp" type="email" autocomplete="email" placeholder="voce@empresa.com"></label>
<label class="lab"><span style="display: flex; justify-content: space-between">Senha<a href="#" style="font-weight: 400">Esqueci a senha</a></span><input class="inp" type="password" autocomplete="current-password" placeholder="••••••••"></label>
<a class="btn p" href="Main.dc.html">Entrar</a>
</div>
<div style="display: flex; align-items: center; gap: 12px; color: #64748B; font-size: 12px"><span style="flex: 1; height: 1px; background: #E2E8F0"></span>ou continue com<span style="flex: 1; height: 1px; background: #E2E8F0"></span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a class="btn o" href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>Google</a>
<a class="btn o" href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="8" height="8"></rect><rect x="13" y="13" width="8" height="8"></rect></svg>Microsoft</a>
</div>
<p style="margin: 0; text-align: center; color: #475569">Não tem conta? <a href="Onboarding.dc.html">Criar conta</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
